name: Playwright Smoke Tests (Manual & Parameterized)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Select branch to run Playwright tests'
        required: true
        default: 'playwright-typescript-ddd-ui-structure-version1.2'
      test_type:
        description: 'Select test type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_ENV: production
      BASE_URL: http://zero.webappsecurity.com
      CI: true

    steps:
      # -----------------------------------
      # Checkout selected branch
      # -----------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      # -----------------------------------
      # Setup Node.js
      # -----------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # -----------------------------------
      # Install dependencies
      # -----------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------
      # Install Playwright browsers
      # -----------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # -----------------------------------
      # Run tests (Smoke / Regression)
      # -----------------------------------
      - name: Run Playwright Tests
        run: |
          if [ "${{ github.event.inputs.test_type }}" = "smoke" ]; then
            npx playwright test tests/smoke --project=chromium
          else
            npx playwright test --project=chromium
          fi

      # -----------------------------------
      # Upload Playwright HTML Report
      # -----------------------------------
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
